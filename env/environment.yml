name: genome-kg
channels:
  - conda-forge
  - bioconda
dependencies:
  # --- Core Specification ---
  - python=3.11
  # Use numpy 2.x for better compatibility with modern ML stack
  - numpy<2  # keep ABI stable with compiled deps like fisher; conda solves matching builds

  # --- Machine Learning & AI ---
  - pytorch
  - transformers
  - scikit-learn
  - h5py
  # Vector database for embeddings (replaces FAISS)
  - lancedb
  - pyarrow

  # --- Data & Databases ---
  - pandas
  - scipy
  - pyarrow
  - rdflib
  - neo4j-python-driver
  - peewee

  # --- Bioinformatics ---
  - pyhmmer
  - biopython
  - ete3
  - mash
  - skani
  - minced  # CRISPR array detector (Bioconda)
  - dbcan  # provides 'run_dbcan' CLI (Bioconda, noarch)
  - fisher  # GECCO optional dependency; avoids ABI mismatch by using conda build

  # --- Plotting & Visualization ---
  - matplotlib
  - seaborn

  # --- CLI & Utilities ---
  - typer
  - pydantic
  - click
  - rich
  - requests
  - pyyaml
  - tqdm
  - loguru
  - more-itertools

  # --- Development, Jupyter & Testing ---
  - jupyter
  - notebook
  - ipykernel
  - pytest
  # Moved from pip to conda for better dependency resolution
  - pytest-cov
  - pytest-xdist
  - pytest-asyncio
  - platformdirs
  - flake8
  - black
  - isort
  - mypy
